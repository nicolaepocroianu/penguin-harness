# Desktop packages: Electron installers for the desktop shell.
#
# A three-OS matrix, run by hand (workflow_dispatch) on any branch: build the workspace, run
# electron-builder, and upload the installers as workflow artifacts named desktop-<OS>.
#
# The installers are unsigned: this repository holds no macOS Developer ID or Windows
# code-signing credentials, and it publishes no releases.
name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Optional Git ref to check out."
        required: false
        type: string
        default: ""
      tag:
        description: Release tag (vX.Y.Z) stamped into the app; empty keeps dev versions.
        required: false
        type: string
        default: ""

env:
  MINGIT_VERSION: 2.55.0.3
  MINGIT_TAG: v2.55.0.windows.3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}

      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Stamp the version given as `tag` into core's VERSION/BUILD_DATE/BUILD_COMMIT
      # constants (what the app and server report) and the desktop package.json
      # electron-builder reads its installer metadata from; otherwise every installer carries
      # the in-repo dev version. node instead of sed -i: this matrix includes macOS, whose BSD
      # sed spells in-place editing differently. Runs without a tag keep the dev versions.
      - name: Stamp release version
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          V="${TAG#v}"
          D="$(date -u +%Y-%m-%d)"
          V="$V" D="$D" GITHUB_SHA="$(git rev-parse HEAD)" node -e '
            const fs = require("fs");
            const p = "packages/core/src/index.ts";
            let s = fs.readFileSync(p, "utf8");
            if (!/export const VERSION = "/.test(s)) throw new Error("VERSION const not found");
            s = s.replace(/export const VERSION = "[^"]*"/, `export const VERSION = "${process.env.V}"`);
            if (!/export const BUILD_DATE: string \| null = /.test(s)) throw new Error("BUILD_DATE const not found");
            s = s.replace(/export const BUILD_DATE: string \| null = [^;]*/, `export const BUILD_DATE: string | null = "${process.env.D}"`);
            if (/export const BUILD_COMMIT: string \| null = /.test(s) && process.env.GITHUB_SHA) {
              s = s.replace(/export const BUILD_COMMIT: string \| null = [^;]*/, `export const BUILD_COMMIT: string | null = "${process.env.GITHUB_SHA}"`);
            }
            fs.writeFileSync(p, s);
          '
          (cd packages/desktop && npm version --no-git-tag-version --allow-same-version "$V")

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # Windows carries MinGit under resources/git so the packaged agent shell has the
      # same deterministic POSIX bash as the npm package (the shell advertises it as
      # WAFH_BUNDLED_SHELL).
      - name: Bundle MinGit (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mingit="MinGit-$MINGIT_VERSION-64-bit.zip"
          curl -fsSL -o "$mingit" \
            "https://github.com/git-for-windows/git/releases/download/$MINGIT_TAG/$mingit"
          unzip -q "$mingit" -d packages/desktop/build/minigit

      # No identity on the runner: electron-builder must not go looking for one.
      - name: Build unsigned on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      # The same check the local pack scripts run: electron-builder skips an absent
      # `from:` source in silence, and a tree without the web build is a 404 app.
      - name: Preflight the packed tree's inputs
        run: node packages/desktop/scripts/preflight.mjs

      # The harness the Machines page installs on other machines, in the hot push's format
      # (dist/install-image.gz, which electron-builder packs with the rest of dist/): every
      # command the app runs on a machine goes through the CLI it leaves in that machine's store.
      - name: Pack the install image
        run: pnpm --dir packages/desktop run image

      - name: Build packages
        run: pnpm --dir packages/desktop exec electron-builder ${{ matrix.args }} --publish never

      - name: Verify Windows update metadata
        if: runner.os == 'Windows'
        env:
          EVSIGN_REQUIRE: "false"
        run: node packages/desktop/scripts/verify-windows-artifacts.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            packages/desktop/out/wafh-desktop-*.AppImage
            packages/desktop/out/wafh-desktop-*.deb
            packages/desktop/out/wafh-desktop-*.dmg
            packages/desktop/out/wafh-desktop-*.zip
            packages/desktop/out/wafh-desktop-*.exe
            # Update metadata: electron-updater reads latest*.yml from the Release, and
            # the blockmaps are what make differential downloads possible. Without these
            # the installers ship but nothing can auto-update.
            packages/desktop/out/latest*.yml
            packages/desktop/out/*.blockmap
