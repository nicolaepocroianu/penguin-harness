# Minimal WAF Harness deployment. The image is built from this checkout's Dockerfile (no
# image is published): from the repository root, `docker compose -f docker/compose.yaml up -d
# --build`, then read the first-login link out of `docker compose -f docker/compose.yaml
# logs wafh`.
#
# See packages/docs/content/quickstart-docker.en.md for the first sign-in, upgrades, running
# behind a reverse proxy, and the rescue path for a forgotten admin password.
services:
  wafh:
    build:
      context: ..
      dockerfile: Dockerfile
    image: waf-harness:local
    restart: unless-stopped
    ports:
      # On the host's loopback: reachable only from the machine running Docker.
      # To open it to a network, publish on all interfaces instead: "7364:7364".
      - "127.0.0.1:7364:7364"
    volumes:
      - wafh-data:/data
    # Shutting down interrupts running Tasks and waits for them to wrap up, which can take
    # a few seconds longer than Docker's 10s default.
    stop_grace_period: 30s
    # environment:
    #   # Pins the built-in admin's password INSTEAD of printing a first-login link. It
    #   # applies only on the very first boot, while no user exists, and must be at least
    #   # 8 characters. Adding it to an already-claimed data root does nothing.
    #   WAFH_SEED_ADMIN_PASSWORD: "choose-something-long"
    #   # Behind a reverse proxy that terminates TLS and sets or strips x-forwarded-proto
    #   # itself, so session cookies are marked Secure.
    #   WAFH_TRUST_PROXY: "1"
    #   # Disables the server's only outbound non-model request, the new-release check.
    #   WAFH_UPDATE_CHECK: "off"

volumes:
  wafh-data:
