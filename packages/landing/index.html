<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="WAF Harness is the open-source Unified and Stable RSI Framework. Fully automatic optimization: any model, any algorithm, any benchmark. One sentence builds an AI app that thinks and runs; one sentence starts an agent's self-evolution."
    />
    <!-- Self-referencing URLs for the home page: scripts/postbuild.mjs rewrites both per
         route as it stamps out the blog shells, and drops the canonical from 404.html.
         Absolute because rel=canonical and Open Graph both ignore relative URLs, so
         these name the production origin whatever BASE_PATH a build uses. -->
    <link rel="canonical" href="https://penguin.ooo/" />
    <meta property="og:url" content="https://penguin.ooo/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WAF Harness" />
    <meta property="og:title" content="WAF Harness" />
    <meta
      property="og:description"
      content="Unified and Stable RSI Framework. Fully automatic optimization: any model, any algorithm, any benchmark. One sentence builds an AI app, one sentence starts self-evolution."
    />
    <meta property="og:image" content="https://penguin.ooo/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WAF Harness — Unified and Stable RSI Framework" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://penguin.ooo/og-cover.png" />
    <link rel="icon" type="image/svg+xml" href="/wafh-logo.svg" />
    <title>WAF Harness — Unified and Stable RSI Framework</title>
    <!-- Apply the stored/system theme before first paint so the page doesn't flash the
         wrong background while React boots. Reads the key shared with the sibling site
         (see site-prefs.ts in @waterford/waf-harness-ui/site), falling back to the retired per-site keys. -->
    <script>
      try {
        var m =
          localStorage.getItem("wafh-site.theme") ||
          localStorage.getItem("wafh-landing.theme") ||
          localStorage.getItem("wafh-docs.theme");
        if (m === "dark" || (m !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
